<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glance">
<meta name="theme-color" content="#0e1116">
<title>Glance</title>
<style>
/* The phone app's look, plainly: dark and flat, 16 from the sides, 16 inside a card, 12 between cards; nothing pressed smaller than 44. */
:root { color-scheme: dark; --ground: #0e1116; --card: #171b22; --card2: #20252d; --line: #2b313b; --ink: #f2f4f7; --dim: #98a2ae; --faint: #5b6470; --accent: #ff7b4a; --lit: #2a1d17; --good: #58c98b; --bad: #f0685d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.45 -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; }
body { padding: calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card, .tile { min-width: 0; }
[hidden] { display: none !important; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
header strong { font-size: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header small { color: var(--dim); font-size: 13px; white-space: nowrap; }
header small::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 8px; }
header small.good::before { background: var(--good); } header small.bad::before { background: var(--bad); }
.card { background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.card > h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--dim); display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.note { color: var(--dim); font-size: 14px; }
.tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.tile { font: inherit; text-align: left; color: var(--ink); background: var(--card); border: 0; border-radius: 20px; padding: 16px; min-height: 84px; display: grid; gap: 6px; align-content: center; }
.tile.wide { grid-column: 1 / -1; }
.tile b { font-size: 17px; font-weight: 600; } .tile small { color: var(--dim); font-size: 12.5px; }
.tile.on { background: var(--lit); } .tile.on b { color: var(--accent); }
.reads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.reads div { background: var(--card2); border-radius: 12px; padding: 8px; min-height: 52px; }
.reads b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; } .reads small { color: var(--dim); font-size: 11px; white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chips button { font: inherit; font-size: 13.5px; color: var(--dim); background: var(--card2); border: 0; border-radius: 99px; height: 36px; padding: 0 14px; white-space: nowrap; flex: none; }
.chips button.on { background: var(--ink); color: #000; font-weight: 600; }
.swatches button { width: 36px; padding: 0; background: var(--c); }
.swatches button.on { background: var(--c); box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 6px var(--card); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; }
.row + .row, .row + .slide { border-top: 0; } .rows > * + .row { border-top: 1px solid var(--line); padding-top: 8px; }
.row b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row small { color: var(--dim); font-size: 12.5px; }
.switch { width: 50px; height: 30px; border-radius: 99px; border: 0; background: #353c47; position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .16s; }
.switch.on { background: var(--accent); } .switch.on::after { transform: translateX(20px); } .switch:disabled { opacity: .4; }
.slide { display: grid; grid-template-columns: minmax(0, 1fr) 3em; gap: 12px; align-items: center; min-height: 32px; }
.slide output { text-align: right; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; margin: 10px 0; background: linear-gradient(90deg, var(--accent) var(--at, 0%), var(--card2) var(--at, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px #0009; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; }
.keys { display: flex; gap: 4px; } .keys button, .text { font: inherit; color: var(--ink); background: none; border: 0; min-width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.note.small { font-size: 12px; color: var(--faint); }
.keys button.main { background: var(--card2); } .text { color: var(--dim); font-size: 13px; border-radius: 12px; height: 32px; }
.ask { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; padding: 24px; }
.ask div { background: var(--card2); border-radius: 24px; padding: 24px 24px 12px; max-width: 328px; display: grid; gap: 12px; }
.ask h3 { margin: 0; font-size: 19px; } .ask p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
.ask nav { display: flex; justify-content: flex-end; gap: 8px; } .ask nav button { font: inherit; font-weight: 600; background: none; border: 0; color: var(--dim); height: 44px; padding: 0 12px; } .ask nav .do { color: var(--bad); }
</style>
</head>
<body>
<header><strong id="name">Glance</strong><small id="status"></small></header>
<div class="card" id="unpaired" hidden><b id="unpaired-title"></b><span class="note" id="unpaired-how"></span></div>
<main id="main" hidden></main>
<script>
"use strict";
// ---- words, in the phone's language
const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
const t = (zh, en) => ZH ? zh : en;
document.documentElement.lang = ZH ? "zh" : "en";

// ---- SHA-256 and HMAC, written out: a page not served over HTTPS is given none by the browser
const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

  const length = bytes.length, whole = ((length + 9 + 63) >> 6) << 6, m = new Uint8Array(whole), view = new DataView(m.buffer), w = new Uint32Array(64);
  m.set(bytes); m[length] = 0x80; view.setUint32(whole - 8, Math.floor(length / 0x20000000)); view.setUint32(whole - 4, (length << 3) >>> 0);
  const r = (x, n) => (x >>> n) | (x << (32 - n));

    for (let i = 0; i < 16; i++) w[i] = view.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) w[i] = (w[i - 16] + (r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3)) + w[i - 7] + (r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10))) >>> 0;
    let [a, b, c, d, e, f, g, k] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (k + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      k = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += k;
  }

}
const joined = (a, b) => { const all = new Uint8Array(a.length + b.length); all.set(a); all.set(b, a.length); return all; };

  (key.length > 64 ? sha256(key) : key).forEach((b, i) => { inner[i] ^= b; outer[i] ^= b; });
  return sha256(joined(outer, sha256(joined(inner, message))));

const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
const unhex = text => new Uint8Array(text.match(/../g).map(pair => parseInt(pair, 16)));
const random = n => { const bytes = new Uint8Array(n); (self.crypto || self.msCrypto).getRandomValues(bytes); return hex(bytes); };

// ---- what this browser keeps: the key the PC offered it (from the link it was opened by: after the #, which is never sent), and a number of its own
const kept = { get: name => { try { return localStorage.getItem(name); } catch (e) { return null; } }, set: (name, value) => { try { localStorage.setItem(name, value); } catch (e) {} } };
const offered = /[#&]k=([0-9a-f]{64})/.exec(location.hash);
if (offered) { kept.set("key", offered[1]); history.replaceState(null, "", location.pathname); }
const key = kept.get("key");
let phone = kept.get("phone");
if (!phone) { phone = random(16); kept.set("phone", phone); }
const called = /iPhone|iPad/.test(navigator.userAgent) ? (/iPad/.test(navigator.userAgent) ? "iPad" : "iPhone") : /Android/.test(navigator.userAgent) ? "Android" : "Browser";

// ---- asking the PC: signed, as the app signs
async function ask(path, body) {
  const method = body ? "POST" : "GET", sent = body ? JSON.stringify(body) : "", time = String(Math.floor(Date.now() / 1000)), nonce = random(8);
  const sign = hex(hmac(unhex(key), new TextEncoder().encode(`${method}\n${path}\n${time}\n${nonce}\n${sent}`)));

  const json = await answer.json().catch(() => ({}));
  if (!answer.ok) throw Object.assign(new Error(json.error || String(answer.status)), { status: answer.status });
  return json;
}

// ---- the page
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (tag === "button") e.type = "button"; return e; };
const main = document.getElementById("main"), status = document.getElementById("status");
let state = null, busy = 0, holding = false, question = null;
const said = (text, kind) => { status.textContent = text; status.className = kind || ""; };

// What is asked shows at once as it will be; the PC's answer then says how it is.
async function act(path, body, expect) {
  if (expect && state) { expect(state); draw(); }
  busy++;
  try { state = await ask(path, body); said(t("已连接", "Connected"), "good"); }
  catch (error) { failed(error); }
  busy--; draw();
}
function failed(error) {
  if (error.status === 401) { said(t("需要重新配对", "Pair again"), "bad"); unpaired(t("电脑不再认这个浏览器", "The PC no longer takes this browser")); }
  else said(error.status ? t("没有做成", "Not done") : t("连不上", "No answer"), "bad");
}
function unpaired(title) {
  main.hidden = true;
  document.getElementById("unpaired").hidden = false;
  document.getElementById("unpaired-title").textContent = title;
  document.getElementById("unpaired-how").textContent = t("在电脑上打开 Glance 的手机遥控，生成网页配对码，用这部手机扫描。", "On the PC, open Glance's remote control, show the code for the web page, and scan it with this phone.");
}

const EFFECTS = [["steady", t("常亮", "Steady")], ["breathing", t("呼吸", "Breathing")], ["rainbow", t("彩虹", "Rainbow")], ["heat", t("跟随温度", "By heat")]];
const COLOURS = ["FF7B4A", "FFFFFF", "70B3FF", "59C98A", "C68CFF", "FF5E7E"];
const MODES = { efficiency: t("最佳能效", "Best efficiency"), balanced: t("平衡", "Balanced"), performance: t("最佳性能", "Best performance") };

// The signs on what is pressed, drawn (as the app draws them): paths on a square of 24.
const SIGNS = { play: "M8 5.5v13l11-6.5z", pause: "M8 5v14M16 5v14", previous: "M18 6v12l-9-6zM6.5 6v12", next: "M6 6v12l9-6zM17.5 6v12" };
function sign_of(name) {
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), path = document.createElementNS(NS, "path");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: 22, height: 22, fill: "none", stroke: "currentColor", "stroke-width": 1.7, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) svg.setAttribute(k, v);
  path.setAttribute("d", SIGNS[name]); svg.append(path);
  return svg;
}
function tile(title, detail, on, press, wide) { const b = el("button", "tile" + (on ? " on" : "") + (wide ? " wide" : "")); b.append(el("b", "", title), el("small", "", detail)); b.onclick = press; return b; }
function chips(list, cls) { const row = el("div", "chips" + (cls ? " " + cls : "")); for (const [text, on, press, colour] of list) { const b = el("button", on ? "on" : "", text); if (colour) b.style.setProperty("--c", "#" + colour); b.onclick = press; row.append(b); } return row; }
function toggle(on, enabled, press) { const b = el("button", "switch" + (on ? " on" : "")); b.disabled = !enabled; b.setAttribute("role", "switch"); b.setAttribute("aria-checked", on); b.onclick = () => press(!on); return b; }
// A line slid: the figure follows the finger; the PC is asked when it is let go.
function slide(value, least, enabled, done) {
  const row = el("div", "slide"), input = el("input"), out = el("output", "", value + "%");
  input.type = "range"; input.min = least; input.max = 100; input.value = value; input.disabled = !enabled;
  const fill = () => input.style.setProperty("--at", ((input.value - least) / (100 - least) * 100) + "%");
  fill();
  input.oninput = () => { holding = true; out.textContent = input.value + "%"; fill(); };
  input.onchange = () => { holding = false; done(+input.value); };
  row.append(input, out);
  return row;
}
function card(title, right) { const c = el("div", "card"), h = el("h2", "", title); if (right) h.append(right); c.append(h); return c; }

function draw() {
  // (Not under a finger that is sliding something, nor under a question.)
  if (!state || holding) return;
  document.getElementById("name").textContent = state.name || "Glance";
  main.hidden = false; main.textContent = "";
  const night = state.night, screen = state.screen !== false, lights = state.lights;
  const reads = state.reads;
  if (reads) {
    const row = el("div", "reads");
    for (const [id, name] of [["cpu", "CPU"], ["gpu", t("显卡", "Graphics")], ["ram", t("内存", "Memory")], ["disk", t("硬盘", "Disk")]]) {
      const read = reads[id] || {}, box = el("div");
      box.append(el("b", "", read.temp != null ? read.temp + "°" : read.load != null ? read.load + "%" : "—"), el("small", "", read.temp != null && read.load != null ? `${name} ${read.load}%` : name));
      row.append(box);
    }
    const c = el("div", "card"); c.append(row); main.append(c);
  }
  const tiles = el("div", "tiles");
  tiles.append(
    tile(t("夜间模式", "Night mode"), night ? t("已开启，电脑还在运行。再点一次结束", "On; the PC is still running. Tap again to end it") : t("电脑继续运行：关屏、关灯、切到节能", "The PC keeps running: screens off, lights off, power saving"), night, () => act("/v1/night", { on: !night }, s => { s.night = !night; s.screen = night; s.lights = night; }), true),
    tile(t("屏幕", "Screens"), screen ? t("亮着，点一下全部关闭", "On. Tap to turn them all off") : t("已关闭，点一下打开", "Off. Tap to turn them on"), screen, () => act("/v1/screen", { on: !screen }, s => { s.screen = !screen; })),
    tile(t("灯光", "Lights"), lights === false ? t("关着，点一下打开", "Off. Tap to turn them on") : t("开着", "On"), lights !== false, () => act("/v1/lights", { on: lights === false }, s => { s.lights = lights === false; })),
  );
  main.append(tiles);
  if ((state.power || []).length > 1) {
    const c = card(t("电源模式", "Power mode"));
    c.append(chips(state.power.map(plan => [MODES[plan.id] || plan.name, plan.on, () => plan.on || act("/v1/power", { plan: plan.id }, s => s.power.forEach(p => { p.on = p.id === plan.id; }))])));
    main.append(c);
  }
  if (lights === true && !night && state.light) {
    const light = state.light, c = card(t("灯光的效果和颜色", "Lighting effect and colour"));
    c.append(
      chips(EFFECTS.filter(([id]) => id !== "heat" || reads).map(([id, name]) => [name, light.effect === id, () => act("/v1/lights", { on: true, effect: id }, s => { s.light.effect = id; })])),
      chips(COLOURS.map(colour => ["", light.color.toUpperCase() === colour, () => act("/v1/lights", { on: true, color: colour }, s => { s.light.color = colour; }), colour]), "swatches"),
      slide(light.brightness == null ? 100 : light.brightness, 5, light.effect !== "rainbow", level => act("/v1/lights", { on: true, brightness: level }, s => { s.light.brightness = level; })),
    );
    main.append(c);
  }
  if (lights === true && !night && state.keys) {
    const keys = state.keys, c = card(t("键盘背光", "Keyboard light"));
    const names = keys.most === 3 ? [t("关", "Off"), t("低", "Low"), t("中", "Medium"), t("高", "High")] : [t("关", "Off")].concat(Array.from({ length: keys.most }, (_, i) => String(i + 1)));
    c.append(chips(names.map((name, level) => [name, keys.level === level, () => act("/v1/keys", { level }, s => { s.keys.level = level; })])));
    main.append(c);
  }
  const monitors = state.monitors || [];
  if (monitors.length > 1) {
    const c = card(t("显示器", "Monitors")), rows = el("div", "rows");
    monitors.forEach((monitor, at) => {
      const row = el("div", "row"), text = el("div"), size = `${monitor.width} × ${monitor.height}`;
      text.append(el("b", "", monitor.name), el("small", "", monitor.on == null ? `${size} · ${t("不支持单独开关", "cannot be turned off by itself")}` : size));
      row.append(text, toggle(monitor.on !== false && screen, monitor.on != null && screen, on => act("/v1/monitor", { index: at, on }, s => { s.monitors[at].on = on; })));
      rows.append(row);
      if (monitor.brightness != null) rows.append(slide(monitor.brightness, 0, monitor.on !== false && screen, level => act("/v1/monitor", { index: at, brightness: level }, s => { s.monitors[at].brightness = level; })));
    });
    c.append(rows); main.append(c);
  }
  if (state.volume != null) {
    const mute = el("button", "text", state.muted ? t("取消静音", "Unmute") : t("静音", "Mute"));
    mute.onclick = () => act("/v1/volume", { muted: !state.muted }, s => { s.muted = !s.muted; });
    const c = card(t("声音", "Sound"), mute);
    c.append(slide(state.volume, 0, true, level => act("/v1/volume", { level }, s => { s.volume = level; s.muted = false; })));
    const media = state.media;
    if (media) {
      const row = el("div", "row"), text = el("div"), keys = el("div", "keys");
      text.append(el("b", "", media.title || media.app), el("small", "", [media.playing ? t("正在播放", "Playing") : t("已暂停", "Paused"), media.artist, media.title ? media.app : ""].filter(Boolean).join(" · ")));
      for (const [sign, what, cls, said] of [["previous", "previous", "", t("上一首", "Previous")], [media.playing ? "pause" : "play", "toggle", "main", media.playing ? t("暂停", "Pause") : t("播放", "Play")], ["next", "next", "", t("下一首", "Next")]]) { const b = el("button", cls || ""); b.setAttribute("aria-label", said); b.append(sign_of(sign)); b.onclick = () => act("/v1/media", { do: what }); keys.append(b); }
      row.append(text, keys); c.append(row);
      // A player known only by its sound: how it may be made to say what it plays.
      if (!media.title) c.append(el("span", "note small", t("这个播放器没有把歌名告诉系统。网易云音乐可以在它的设置里打开“开启 SMTC”。", "This player does not tell Windows what it plays. In NetEase Cloud Music, turn on “SMTC” in its settings.")));
    }
    main.append(c);
  }
  main.append(tile(t("睡眠", "Sleep"), t("整台电脑停下来，最省电。不能从手机唤醒，要在电脑上按键盘或电源键", "The whole PC stops: the least power. The phone cannot wake it; press a key or the power button on the PC"), false, () => { question = true; draw(); }, true));
  if (question) {
    const over = el("div", "ask"), box = el("div"), nav = el("nav"), no = el("button", "", t("取消", "Cancel")), yes = el("button", "do", t("睡眠", "Sleep"));
    no.onclick = () => { question = null; draw(); };
    yes.onclick = () => { question = null; act("/v1/sleep", {}); };
    nav.append(no, yes);
    box.append(el("h3", "", t("让电脑睡眠？", "Put the PC to sleep?")), el("p", "", t("电脑上的一切都会停下：下载、远程连接、正在跑的程序。睡着后不能从手机唤醒，要在电脑上按键盘或电源键。", "Everything on the PC stops: downloads, remote connections, programs at work. Asleep, it cannot be woken from the phone; press a key or the power button on the PC.")), el("p", "", t("只想关屏关灯、让电脑继续运行，请用夜间模式。", "To turn off only the screens and the lights and leave the PC running, use night mode.")), nav);
    over.append(box); main.append(over);
  }
}

// ---- how the PC is, asked while the page is looked at
async function look() {
  if (busy || document.hidden) return;
  try { const answer = await ask("/v1/state"); if (!busy) { state = answer; said(t("已连接", "Connected"), "good"); draw(); } }
  catch (error) { if (!busy) failed(error); }
}
if (!key) { said(""); unpaired(t("这个浏览器还没有和电脑配对", "This browser is not paired with the PC")); }
else { said(t("正在连接…", "Reaching it…")); look(); setInterval(look, 2000); document.addEventListener("visibilitychange", look); }
</script>
