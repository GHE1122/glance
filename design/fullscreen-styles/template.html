<style>
/* Layout: the music full screen, as Glance shows it: one picture filling the screen, the controls along the bottom. */
:root {
  --night: #050407;
  --white: #ffffff;
  --sans: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  --display: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
  --comic: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
  --bang: "Bangers", "Impact", sans-serif;
  --condensed: "Oswald", "Bahnschrift", "Arial Narrow", sans-serif;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--white); overflow: hidden; font-family: var(--sans); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* The controls, drawn as Glance draws them: a darkening along the bottom, the track short in the middle with its
   times at its ends, the keys under it, the sound and the way out at the right. */
.controls { position: fixed; left: 0; right: 0; bottom: 0; height: 140px; transition: opacity 0.35s ease; z-index: 3; }
.controls::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.42)); pointer-events: none; }
body.idle .controls { opacity: 0; }
body.idle { cursor: none; }
.keys { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 18px; }
.key { width: 44px; height: 44px; border: 0; padding: 0; background: none; color: rgba(255,255,255,0.82); display: grid; place-items: center; cursor: pointer; }
.key:hover, .key:focus-visible { color: #fff; outline: none; }
.key svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.key.toggle svg { width: 30px; height: 30px; }
.key.toggle svg .solid { fill: currentColor; stroke: none; }
.track { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: min(42vw, 420px); height: 20px; cursor: pointer; }
.track .line, .track .done { position: absolute; left: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; }
.track .line { right: 0; background: rgba(255,255,255,0.22); }
.track .done { background: rgba(255,255,255,0.85); }
.track:hover .line, .track:hover .done { height: 5px; margin-top: -2.5px; }
.track:hover .line { background: rgba(255,255,255,0.3); }
.track:hover .done { background: #fff; }
.time { position: absolute; top: 2px; font: 500 12px var(--ui); color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; width: 60px; }
.time.now { right: calc(100% + 10px); text-align: right; }
.time.all { left: calc(100% + 10px); }
.pill { position: absolute; bottom: 22px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.6); font: 500 12px var(--ui); color: rgba(255,255,255,0.95); transform: translateX(-50%); white-space: nowrap; display: none; font-variant-numeric: tabular-nums; }
.track:hover .pill { display: block; }
.right { position: absolute; right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.sound { position: relative; }
.pop { position: absolute; left: 2px; bottom: 50px; width: 40px; height: 156px; border-radius: 20px; background: rgba(0,0,0,0.45); display: none; }
.sound:hover .pop, .pop.held { display: block; }
.pop span { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font: 600 12px var(--ui); color: rgba(255,255,255,0.9); }
.pop .bar { position: absolute; left: 18.5px; width: 3px; top: 34px; bottom: 16px; border-radius: 2px; background: rgba(255,255,255,0.22); cursor: pointer; }
.pop .bar i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: rgba(255,255,255,0.85); }
.styles { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: calc(24px + env(safe-area-inset-right, 0px)); display: flex; gap: 2px; z-index: 3; transition: opacity 0.35s ease; }
body.idle .styles { opacity: 0; }
.styles button { font: 500 13px var(--ui); color: rgba(255,255,255,0.6); background: none; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.styles button[aria-pressed="true"] { color: #fff; background: rgba(0,0,0,0.35); }
#fade { z-index: 1; pointer-events: none; opacity: 0; }
#fade.out { transition: opacity 0.6s ease; }
.start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 4, 7, 0.6); z-index: 5; }
.start[hidden] { display: none !important; }
.start div { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 0 24px; }
.start button { font: 900 18px var(--sans); border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer; background: #fff; color: #111; }
.start p { margin: 0; font-size: 13px; opacity: 0.75; max-width: 34em; line-height: 1.6; }
.jump { position: fixed; left: calc(24px + env(safe-area-inset-left, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; z-index: 3; transition: opacity 0.35s ease; }
body.idle .jump { opacity: 0; }
.jump button { font: 500 12px var(--ui); color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.3); border: 0; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
@media (max-width: 640px) { .jump { display: none; } .track { width: 52vw; } }

<script>
// The style shown: the page's own, or the one its link names (#paper, #space, #poster); changed in place, the song
// playing on.
const FIXED = "__STYLE__";
let STYLE = ["poster", "pop", "pv"].includes(location.hash.slice(1)) ? location.hash.slice(1) : FIXED !== "any" ? FIXED : "poster";
const LINES = __LINES__;
const AN = __ANALYSIS__;
const COVER = "data:image/jpeg;base64,__COVER__";
const SONG = __SONG__;
const TITLE = SONG.title, ARTIST = SONG.artist, LATIN = SONG.latin;
const PAGES = __PAGES__;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const canvas = $("scene"), g = canvas.getContext("2d");
const glCanvas = $("gl");
let W = 0, H = 0, DPR = 1;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = (t) => 1 - (1 - clamp(t)) ** 3;
const easeExpo = (t) => (t >= 1 ? 1 : 1 - 2 ** (-10 * clamp(t)));
const easeBack = (t) => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; };
// Randomness by hash: the same inputs always give the same draw (a line sung twice looks the same).
function hash(...xs) { let h = 2166136261; for (const x of xs) { const s = String(x); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= 0x9e37; h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
let seq = 1; const rand = () => hash("r", seq++);
const pick = (arr, r) => arr[Math.floor(r * arr.length) % arr.length];
class Spring {
  constructor(v, w = 12, z = 0.6) { this.v = v; this.t = v; this.vel = 0; this.w = w; this.z = z; }
  step(dt) { const a = -this.w * this.w * (this.v - this.t) - 2 * this.z * this.w * this.vel; this.vel += a * dt; this.v += this.vel * dt; return this.v; }
}

// ---------- The song ----------
const audio = new Audio();
let actx = null, analyser = null, freq = null;
const DURATION = AN.duration;
$("tAll").textContent = time(DURATION);
function hook() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaElementSource(audio);
  analyser = actx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.55;
  freq = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); analyser.connect(actx.destination);
}
const pos = () => audio.currentTime || 0;
const playing = () => !audio.paused;
function toggle() { if (!audio.src) return; hook(); actx.resume(); audio.paused ? audio.play() : audio.pause(); }
function seek(p) { audio.currentTime = clamp(p, 0, DURATION - 0.2); }
function time(s) { s = Math.max(0, Math.floor(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

// ---------- What the music does now ----------
// The beats were found in the song once, as Glance can by listening; spectrum and loudness are heard live.
const BEATS = AN.beats;
const music = { beat: -1, down: false, kick: 0, bass: 0, mid: 0, high: 0, bands: new Float32Array(24), intensity: 0, flow: 0 };
const onBeat = [];
function beatAt(p) { let lo = 0, hi = BEATS.length - 1, i = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (BEATS[m] <= p) { i = m; lo = m + 1; } else hi = m - 1; } return i; }
function intensityAt(p) { let s = 0, n = 0; for (let t = p - 3; t <= p + 0.5; t += 0.1) { const v = AN.rms10[Math.round(t * 10)]; if (v !== undefined) { s += v; n++; } } return clamp(((n ? s / n : 0) - 0.18) / 0.42); }
function listen(p, dt) {
  const b = beatAt(p);
  if (b !== music.beat) {
    const fresh = b === music.beat + 1 && playing();
    music.beat = b;
    music.down = b >= 0 && ((b - AN.down) % 4 + 4) % 4 === 0;
    if (fresh) for (const f of onBeat) f(b, music.down);
  }
  const since = b >= 0 ? p - BEATS[b] : 9;
  music.kick = playing() ? Math.exp(-since * 5) * (music.down ? 1 : 0.65) : music.kick * Math.exp(-dt * 5);
  if (analyser && playing()) {
    analyser.getByteFrequencyData(freq);
    const hz = actx.sampleRate / analyser.fftSize;
    const band = (a, z) => { let s = 0, c = 0; for (let i = Math.max(1, Math.floor(a / hz)); i <= Math.ceil(z / hz); i++) { s += freq[i]; c++; } return s / c / 255; };
    music.bass = lerp(music.bass, band(30, 140), 0.5);
    music.mid = lerp(music.mid, band(300, 2500), 0.4);
    music.high = lerp(music.high, band(5000, 12000), 0.4);
    for (let k = 0; k < 24; k++) music.bands[k] = lerp(music.bands[k], band(40 * 2 ** (k / 2.6), 40 * 2 ** ((k + 1) / 2.6)), 0.45);
  } else { music.bass *= 0.92; music.mid *= 0.92; music.high *= 0.92; for (let k = 0; k < 24; k++) music.bands[k] *= 0.9; }
  music.intensity = lerp(music.intensity, intensityAt(p), Math.min(1, dt * 2));
  // Its own time, never backwards: faster as the song swells (as the smoke flows).
  if (playing()) music.flow += dt * (0.5 + 1.2 * music.intensity + 0.8 * music.bass);
}

// ---------- Lyrics, and how each line moves (after JIZURA's planner) ----------
const LYRICS = LINES.filter((l) => !/^\s*(作词|作曲|编曲|制作人)\s*:/.test(l[2].map((w) => w[2]).join(""))).map((l, i) => {
  const chars = [];
  l[2].forEach(([t, d, text], wi) => {
    const cs = Array.from(text);
    cs.forEach((c, k) => chars.push({ c, t: t + (d * k) / cs.length, d: d / cs.length, word: wi }));
  });
  while (chars.length && !chars[chars.length - 1].c.trim()) chars.pop();
  while (chars.length && !chars[0].c.trim()) chars.shift();
  return { i, t: l[0], end: l[0] + l[1], chars, text: chars.map((c) => c.c).join("") };
});
const CREDITS = LINES.filter((l) => /^\s*(作词|作曲|编曲)/.test(l[2].map((w) => w[2]).join(""))).map((l) => l[2].map((w) => w[2]).join("").trim());
// Sections: a gap of more than six seconds starts one; a line sung more than once in the song is the chorus's.
const counts = {};
for (const l of LYRICS) counts[l.text] = (counts[l.text] || 0) + 1;
let section = 0;
LYRICS.forEach((l, k) => {
  if (k > 0 && l.t - LYRICS[k - 1].end > 6) section++;
  const chorus = counts[l.text] > 1;
  if (k > 0 && chorus !== LYRICS[k - 1].chorus) section++;
  l.section = section; l.chorus = chorus;
});
// Key lines: the first of each section, and the last line of the song; each gets one big shot.
LYRICS.forEach((l, k) => { l.key = k === 0 || l.section !== LYRICS[k - 1].section || k === LYRICS.length - 1; });
// Each section reuses two or three moves; a line takes one by its own text (so a repeated line moves the same), and
// moves alternate their direction within the section.
function planLines(families) {
  const bySection = {};
  for (const l of LYRICS) {
    if (!bySection[l.section]) {
      const r = hash("sec", l.chorus ? "chorus" : l.section);
      const pool = families.slice().sort((a, b) => hash(a, r) - hash(b, r));
      bySection[l.section] = { moves: pool.slice(0, 2 + Math.floor(r * 2)), turn: 0 };
    }
    const s = bySection[l.section];
    l.move = pick(s.moves, hash("line", l.text));
    l.dir = s.turn++ % 2 === 0 ? 1 : -1;
    if (l.chorus) l.dir = hash("dir", l.text) < 0.5 ? 1 : -1;
  }
}
function lineAt(p) {
  let i = -1;
  for (let k = 0; k < LYRICS.length; k++) if (LYRICS[k].t <= p + 0.06) i = k;
  if (i >= 0 && p > LYRICS[i].end + 2.5 && (i + 1 >= LYRICS.length || LYRICS[i + 1].t - p > 1.5)) return -1;
  return i;
}
// The line on screen and the one leaving it.
const shown = { li: -2, lines: [] };
function followLines(p, now, onLine) {
  const li = lineAt(p);
  if (li !== shown.li) {
    for (const s of shown.lines) if (!s.leaving) s.leaving = now;
    if (li >= 0) shown.lines.push({ line: LYRICS[li], at: now, leaving: 0 });
    if (shown.li !== -2 && onLine) onLine(li);
    shown.li = li;
  }
  shown.lines = shown.lines.filter((s) => !s.leaving || now - s.leaving < 1.2);
  return li;
}

// ---------- Colours from the cover ----------
const cover = new Image();
cover.src = COVER;
let palette = [[22, 14, 14], [244, 204, 186], [236, 120, 150], [250, 244, 238], [120, 70, 56], [214, 160, 130]];
palette.accent = [236, 120, 150];
function hsl(r, g2, b) { r /= 255; g2 /= 255; b /= 255; const mx = Math.max(r, g2, b), mn = Math.min(r, g2, b), l = (mx + mn) / 2; if (mx === mn) return [0, 0, l]; const d = mx - mn, s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn); const h = mx === r ? (g2 - b) / d + (g2 < b ? 6 : 0) : mx === g2 ? (b - r) / d + 2 : (r - g2) / d + 4; return [h / 6, s, l]; }
function rgb(h, s, l) { h = ((h % 1) + 1) % 1; const f = (n) => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); }; return [f(0), f(8), f(4)]; }
function lum([r, g2, b]) { const c = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }; return 0.2126 * c(r) + 0.7152 * c(g2) + 0.0722 * c(b); }
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const inkOn = (c) => (lum(c) > 0.3 ? [20, 14, 14] : [252, 247, 242]);
function paletteFromCover() {
  const c = document.createElement("canvas"); c.width = c.height = 48;
  const x = c.getContext("2d"); x.drawImage(cover, 0, 0, 48, 48);
  const px = x.getImageData(0, 0, 48, 48).data, pts = [];
  for (let i = 0; i < px.length; i += 4) pts.push([px[i], px[i + 1], px[i + 2]]);
  let cs = Array.from({ length: 8 }, (_, k) => pts[Math.floor((k + 0.5) * pts.length / 8)].slice()), cn = [];
  for (let it = 0; it < 10; it++) {
    const sum = cs.map(() => [0, 0, 0]); cn = cs.map(() => 0);
    for (const p of pts) { let best = 0, bd = 1e9; cs.forEach((c2, k) => { const d = (p[0] - c2[0]) ** 2 + (p[1] - c2[1]) ** 2 + (p[2] - c2[2]) ** 2; if (d < bd) { bd = d; best = k; } }); sum[best][0] += p[0]; sum[best][1] += p[1]; sum[best][2] += p[2]; cn[best]++; }
    cs = cs.map((c2, k) => cn[k] ? sum[k].map((v) => v / cn[k]) : c2);
  }
  const out = [];
  for (const { c: c2 } of cs.map((c2, k) => ({ c: c2, n: cn[k] })).sort((a, b) => b.n - a.n)) {
    const [h, s, l] = hsl(...c2); const v = rgb(h, Math.min(1, s * 1.4 + 0.06), l);
    if (out.every((o) => Math.hypot(o[0] - v[0], o[1] - v[1], o[2] - v[2]) > 46)) out.push(v);
  }
  const [h0] = hsl(...out[0]);
  if (!out.some((o) => lum(o) < 0.03)) out.push(rgb(h0, 0.3, 0.07));
  if (!out.some((o) => lum(o) > 0.75)) out.push(rgb(h0, 0.45, 0.94));
  palette = out.slice(0, 7);
  // The accent: the cover's most vivid pixels (saturated, neither dark nor pale), however few, averaged.
  const vivid = pts.map((p) => { const [, s, l] = hsl(...p); return { p, v: s * (1 - Math.abs(l - 0.55) * 1.6) }; }).sort((a, b) => b.v - a.v).slice(0, Math.max(8, pts.length * 0.03));
  const mean = [0, 1, 2].map((k) => vivid.reduce((u, x) => u + x.p[k], 0) / vivid.length);
  const [ha, sa] = hsl(...mean);
  palette.accent = rgb(ha, Math.max(0.6, sa), 0.62);
}

// ---------- Characters in motion: entrances and exits (after JIZURA's recipes) ----------
// `k` is how far a character is into its entrance (0 to 1), `out` into its exit; `draw(dx, dy)` draws it where it
// rests offset by (dx, dy), in the transform set for it.
function enterChar(move, k, dir, idx, draw, size, x, y, ch, font) {
  if (k <= 0) return;
  g.save();
  switch (move) {
    case "slam": { const s = lerp(1.9, 1, easeBack(k)); g.translate(x, y - size * 0.35); g.scale(s, s); g.rotate((1 - easeOut(k)) * 0.22 * (idx % 2 ? 1 : -1)); g.translate(-x, -(y - size * 0.35)); g.globalAlpha *= clamp(k * 3); draw(0, -(1 - easeOut(k)) * size * 0.5); break; }
    case "slice": {
      // Bands of the character slide in from alternate sides.
      const bands = 6, bh = size * 1.25 / bands;
      for (let b = 0; b < bands; b++) {
        const kb = easeExpo(clamp(k * 1.4 - b * 0.06));
        g.save(); g.beginPath(); g.rect(x - size, y - size * 1.05 + b * bh, size * 3, bh + 0.6); g.clip();
        draw((1 - kb) * size * 3 * ((b % 2 ? 1 : -1) * dir), 0); g.restore();
      }
      break;
    }
    case "assemble": {
      // Four pieces fly in from their own angles and lock together.
      for (let q = 0; q < 4; q++) {
        const a = hash("as", ch, idx, q) * 6.283, kq = easeExpo(clamp(k * 1.2 - q * 0.05)), r = (1 - kq) * size * 2.2;
        g.save(); g.beginPath(); g.rect(x - size * 0.1 + (q % 2) * size * 0.6, y - size * 1.05 + (q >> 1) * size * 0.62, size * 0.62, size * 0.64); g.clip();
        g.globalAlpha *= clamp(kq * 2); draw(Math.cos(a) * r, Math.sin(a) * r); g.restore();
      }
      break;
    }
    case "scramble": {
      // Other characters of the line flicker through, then it settles.
      if (k < 0.75) { const pool = "如果你我爱的事情想要一件不是"; const alt = pool[Math.floor(hash("sc", idx, Math.floor(k * 12)) * pool.length)]; g.globalAlpha *= 0.6; draw(0, 0, alt); }
      else draw(0, 0);
